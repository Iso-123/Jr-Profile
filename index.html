<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JR Profile</title>

    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>
    <div class="background-overlay"></div>

    <!-- Profile Container -->
    <main class="profile-container">

        <!-- Profile Picture -->
        <img src="profile.jpg" alt="Profile Picture" class="profile-pic">

        <!-- Username -->
        <h1 class="username">Unyok ♡ 𝟏 </h1>

        <!-- Bio -->
        <p class="bio">Wanna know me better?? </p>

        <!-- Location / Status -->
        <p class="status">
            <i class="fa-solid fa-location-dot"></i>
            Sa puso ng esme ko
        </p>

        <!-- Social Media Links -->
        <div class="social-links">


           <a href="https://www.facebook.com/profile.php?id=61591371482573" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="https://www.instagram.com/_yknowww.memoreee/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.tiktok.com/@_sooonnn_" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>

        </div>

        <!-- Music Player -->
        <div class="music-player">

            <div class="music-top">

                <img src="album.jpg" alt="Album Cover" class="album-cover">

                <div class="music-info">
                    <h3>Isa lang</h3>
                    <p>Arthur Nery</p>
                </div>

                <button id="play-btn" aria-label="Play or pause music">
                    <i class="fa-solid fa-play"></i>
                </button>

            </div>

            <!-- Volume -->
            <div class="volume-control">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
            </div>

            <!-- Progress -->
            <div class="progress-container">
                <input type="range" id="progress" min="0" max="100" value="0" aria-label="Music progress">

                <div class="time">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

        </div>

        <!-- Audio -->
        <audio id="audio" preload="metadata">
            <source src="music.mp3" type="audio/mpeg">
        </audio>

    </main>

    <script src="script.js"></script>

</body>
</html>
